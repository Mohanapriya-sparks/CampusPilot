name: campuspilot_prototype
description: CampusPilot personalized student opportunity discovery MVP.
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  shared_preferences: ^2.3.2
  file_picker: 8.1.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/campuspilot_logo.png
    - assets/images/events/sih_2026.jpg
    - assets/images/events/treehacks_banner.png
    - assets/images/social/google.png
    - assets/images/social/github.png
    - assets/images/social/linkedin.png
